<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iTechLab — Administração</title>
<style>
  :root{
    --bg: #0d1117;
    --panel: #141b22;
    --panel-2: #182029;
    --line: #263140;
    --text: #dbe4ec;
    --muted: #7c8b9b;
    --accent: #e2222e;
    --accent-dim: #5c1015;
    --danger: #ff5a5a;
    --mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 1px 1px, rgba(63,219,143,0.05) 1px, transparent 0) 0 0/22px 22px,
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    line-height:1.5;
  }
  .wrap{max-width:900px;margin:0 auto;padding:28px 18px 60px;}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px;flex-wrap:wrap;}
  header h1{font-size:1.2rem;font-weight:600;margin:0;}
  header h1 .dot{color:var(--accent);}
  .btn-ghost{
    font-family:var(--sans);font-weight:600;font-size:0.8rem;
    background:transparent;border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:8px 14px;cursor:pointer;
  }
  .btn-ghost:hover{border-color:var(--accent-dim);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:20px;}
  .card h2{font-size:0.78rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 14px 0;}
  label{display:block;font-size:0.75rem;color:var(--muted);margin-bottom:4px;margin-top:12px;}
  input, select, textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;
    color:var(--text);font-family:var(--sans);font-size:0.88rem;padding:9px 12px;
  }
  textarea{font-family:var(--sans);min-height:70px;resize:vertical;}
  button.primary{
    margin-top:16px;background:var(--accent);color:#ffffff;font-weight:600;
    border:none;border-radius:7px;padding:10px 18px;cursor:pointer;font-size:0.85rem;
  }
  button.primary:hover{background:#ff4550;}
  .erro{color:var(--danger);font-size:0.8rem;margin-top:10px;font-family:var(--mono);}
  .ok{color:var(--accent);font-size:0.8rem;margin-top:10px;}
  table{width:100%;border-collapse:collapse;font-size:0.8rem;}
  th{text-align:left;color:var(--muted);font-weight:500;font-size:0.68rem;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line);}
  td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;}
  td.acoes{white-space:nowrap;}
  .del-btn{background:transparent;border:1px solid var(--danger);color:var(--danger);border-radius:6px;padding:4px 9px;font-size:0.72rem;cursor:pointer;}
  .del-btn:hover{background:rgba(224,96,61,0.1);}
  .edit-btn{background:transparent;border:1px solid var(--accent-dim);color:var(--accent);border-radius:6px;padding:4px 9px;font-size:0.72rem;cursor:pointer;margin-right:6px;}
  .edit-btn:hover{background:rgba(226,34,46,0.1);}
  .tipo-tag{font-family:var(--mono);font-size:0.68rem;background:rgba(226,34,46,0.1);color:var(--accent);padding:2px 6px;border-radius:4px;}
  #loginBox{max-width:360px;margin:60px auto;}
  .hint{color:var(--muted);font-size:0.78rem;}
</style>
</head>

<script>
const SUPABASE_URL = 'https://vpwwtgecmpbuucpyunot.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwd3d0Z2VjbXBidXVjcHl1bm90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0ODEwMTEsImV4cCI6MjEwNDA1NzAxMX0.4l1IxtNRB2SP-hfxifcE34DjLGgP6SktQMz9qcsDHjA';

let sessao = JSON.parse(localStorage.getItem('itechlab_sessao') || 'null');

function salvarSessao(s){
  sessao = s;
  if(s) localStorage.setItem('itechlab_sessao', JSON.stringify(s));
  else localStorage.removeItem('itechlab_sessao');
}

async function entrar(){
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  const erroEl = document.getElementById('loginErro');
  erroEl.textContent = '';
  try{
    const resp = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: senha })
    });
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error_description || data.msg || 'Login inválido');
    salvarSessao({ access_token: data.access_token, email });
    mostrarPainel();
  }catch(e){
    erroEl.textContent = 'Erro: ' + e.message;
  }
}

function sair(){
  salvarSessao(null);
  document.getElementById('painel').style.display = 'none';
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('btnLogout').style.display = 'none';
}

function mostrarPainel(){
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('painel').style.display = 'block';
  document.getElementById('btnLogout').style.display = 'inline-block';
  carregarCasos();
}

async function chamarTabela(metodo, caminho, corpo){
  const resp = await fetch(SUPABASE_URL + '/rest/v1/' + caminho, {
    method: metodo,
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: 'Bearer ' + sessao.access_token,
      'Content-Type': 'application/json',
      Prefer: 'return=representation'
    },
    body: corpo ? JSON.stringify(corpo) : undefined
  });
  if(resp.status === 401){ sair(); throw new Error('Sessão expirada, faça login de novo.'); }
  if(!resp.ok){
    const t = await resp.text().catch(() => '');
    throw new Error('HTTP ' + resp.status + ' — ' + t.slice(0,200));
  }
  return resp.status === 204 ? null : resp.json();
}

let casosCache = [];
let editandoId = null;

async function carregarCasos(){
  try{
    const casos = await chamarTabela('GET', 'solucoes?select=*&order=id.desc');
    casosCache = casos;
    document.getElementById('totalCasos').textContent = casos.length + ' caso(s) no total';
    const tbody = document.getElementById('tabelaCasos');
    tbody.innerHTML = casos.map(c => `
      <tr>
        <td><span class="tipo-tag">${c.tipo}</span></td>
        <td>${escapeHtml(c.padrao || '')}</td>
        <td>${escapeHtml(c.modelo || '—')}</td>
        <td>${escapeHtml(c.componente || '')}</td>
        <td>${escapeHtml((c.solucao || '').slice(0,80))}</td>
        <td class="acoes">
          <button class="edit-btn" onclick="editarCaso(${c.id})">Editar</button>
          <button class="del-btn" onclick="apagarCaso(${c.id})">Apagar</button>
        </td>
      </tr>
    `).join('');
  }catch(e){
    document.getElementById('totalCasos').textContent = 'Erro ao carregar: ' + e.message;
  }
}

function editarCaso(id){
  const c = casosCache.find(x => x.id === id);
  if(!c) return;
  editandoId = id;
  document.getElementById('fTipo').value = c.tipo;
  document.getElementById('fPadrao').value = c.padrao || '';
  document.getElementById('fModelo').value = c.modelo || '';
  document.getElementById('fComponente').value = c.componente || '';
  document.getElementById('fCausa').value = c.causa || '';
  document.getElementById('fSolucao').value = c.solucao || '';
  document.getElementById('formTitulo').textContent = 'Editando caso #' + id;
  document.getElementById('btnSalvar').textContent = 'Salvar edição';
  document.getElementById('btnCancelarEdicao').style.display = 'inline-block';
  document.getElementById('cadastroMsg').textContent = '';
  window.scrollTo({top:0, behavior:'smooth'});
}

function cancelarEdicao(){
  editandoId = null;
  ['fPadrao','fModelo','fComponente','fCausa','fSolucao'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('formTitulo').textContent = 'Cadastrar novo caso';
  document.getElementById('btnSalvar').textContent = 'Cadastrar';
  document.getElementById('btnCancelarEdicao').style.display = 'none';
  document.getElementById('cadastroMsg').textContent = '';
}

async function cadastrarCaso(){
  const msgEl = document.getElementById('cadastroMsg');
  msgEl.textContent = '';
  msgEl.className = '';
  const dados = {
    tipo: document.getElementById('fTipo').value,
    padrao: document.getElementById('fPadrao').value.trim(),
    modelo: document.getElementById('fModelo').value.trim() || null,
    componente: document.getElementById('fComponente').value.trim(),
    causa: document.getElementById('fCausa').value.trim() || null,
    solucao: document.getElementById('fSolucao').value.trim()
  };
  if(!dados.padrao || !dados.componente || !dados.solucao){
    msgEl.textContent = 'Preencha ao menos padrão, componente e solução.';
    msgEl.className = 'erro';
    return;
  }
  try{
    if(editandoId){
      await chamarTabela('PATCH', 'solucoes?id=eq.' + editandoId, dados);
      msgEl.textContent = 'Caso atualizado!';
    } else {
      await chamarTabela('POST', 'solucoes', dados);
      msgEl.textContent = 'Caso cadastrado!';
    }
    msgEl.className = 'ok';
    cancelarEdicao();
    carregarCasos();
  }catch(e){
    msgEl.textContent = 'Erro: ' + e.message;
    msgEl.className = 'erro';
  }
}

async function apagarCaso(id){
  if(!confirm('Apagar esse caso?')) return;
  try{
    await chamarTabela('DELETE', 'solucoes?id=eq.' + id);
    if(editandoId === id) cancelarEdicao();
    carregarCasos();
  }catch(e){
    alert('Erro ao apagar: ' + e.message);
  }
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// se já tem sessão salva, entra direto
if(sessao && sessao.access_token) mostrarPainel();
</script>
